<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malaysia Water &amp; Power Atlas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#0d2b3a; --ink2:#46606e; --paper:#f7f4ec; --card:#ffffff; --line:#e4dfd2;
  --water:#1b7fd1; --water-d:#0e5a9c; --water-l:#e3f1fc;
  --power:#f0a000; --power-d:#a86d00; --power-l:#fff1d1;
  --good:#1f9d6b; --warn:#c2410c;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --side:400px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:var(--side) 1fr;height:100%}
main{position:relative;min-height:0}
#map{height:100%;background:#cfe3ee}

/* ---------- sidebar ---------- */
#side{display:flex;flex-direction:column;min-height:0;background:var(--paper);border-right:1px solid var(--line);z-index:5}
.head{padding:20px 22px 14px;background:linear-gradient(135deg,#0d3b57 0%,#0e5a9c 60%,#1b7fd1 100%);color:#fff;position:relative;overflow:hidden}
.head:after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#f0a00055,transparent 65%)}
.head h1{font:700 24px/1.15 var(--serif);margin:0 0 4px;position:relative}
.head p{margin:0;font-size:13px;opacity:.85;position:relative}
.head .row{display:flex;gap:8px;margin-top:12px;position:relative}
.pill-btn{background:#ffffff22;border:1px solid #ffffff55;color:#fff;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
.pill-btn:hover{background:#ffffff38}
.seg{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 16px 0;background:#e9e4d6;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button small{font-weight:500;font-size:11px;opacity:.8}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0002}
.seg button.on[data-cat=water]{color:var(--water-d)}
.seg button.on[data-cat=power]{color:var(--power-d)}
.tabs{display:flex;gap:4px;margin:12px 16px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;font-size:14px;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--water)}
.pane{display:none;flex:1;min-height:0;overflow:auto;padding:14px 16px 24px}
.pane.on{display:block}

/* language toggle + photos */
.head .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.lang{display:flex;background:#ffffff22;border:1px solid #ffffff66;border-radius:99px;padding:2px;flex:none;z-index:2}
.lang button{border:0;background:none;color:#fff;border-radius:99px;padding:4px 11px;font-size:13px;font-weight:700}
.lang button.on{background:#fff;color:var(--water-d)}
.photo{margin:6px 0 10px;border-radius:12px;overflow:hidden;background:#e9e4d6;display:none}
.photo.on{display:block}
.photo img{display:block;width:100%;max-height:210px;object-fit:cover}
.photo figcaption{font-size:11.5px;color:var(--ink2);padding:5px 10px;background:#fff}
.photo figcaption a{color:var(--water-d)}
.sub-en{font-size:13px;color:var(--ink2);margin:0 0 6px}
html[lang=zh-Hans] body{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
html[lang=zh-Hans] .head h1,html[lang=zh-Hans] .detail h2,html[lang=zh-Hans] .quiz .big,html[lang=zh-Hans] #caption h2{font-family:'Songti SC','Noto Serif CJK SC','SimSun',var(--serif)}

/* explore */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;gap:6px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;background:#ccc}
.chip.on{color:var(--ink);border-color:var(--ink)}
.chip.on i{background:var(--c)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters input,.filters select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:14px;color:var(--ink)}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;transition:.15s}
.item:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 4px 14px #0d2b3a14}
.item .nm{font-weight:650;font-size:14.5px;line-height:1.25}
.item .sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ico.water{background:var(--water)}.ico.power{background:var(--power)}
.ico svg{width:18px;height:18px}
.empty{text-align:center;color:var(--ink2);padding:30px 10px;font-size:14px}

/* detail */
.back{border:0;background:none;color:var(--water-d);font-weight:600;padding:0 0 10px;font-size:14px}
.detail h2{font:700 24px/1.2 var(--serif);margin:0 0 4px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;margin:4px 6px 4px 0}
.tag.water{background:var(--water-l);color:var(--water-d)}
.tag.power{background:var(--power-l);color:var(--power-d)}
.tag.ok{background:#dcf5ea;color:#0f6b47}.tag.approx{background:#fde8d8;color:var(--warn)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
.facts dt{color:var(--ink2)}.facts dd{margin:0;font-weight:600}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.box h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.box p,.box li{font-size:14.5px;line-height:1.5;margin:4px 0}
.box ul{padding-left:18px;margin:4px 0}
.box.q{background:linear-gradient(135deg,#fff8e6,#fff);border-color:#f3dba0}
.nav2{display:flex;gap:8px;margin-top:14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:9px 16px;font-weight:650;font-size:14px}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:hover{opacity:.9}

/* learn */
.learn details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:2px 16px}
.learn summary{cursor:pointer;font-weight:700;padding:13px 0;font-size:15px;list-style:none;display:flex;justify-content:space-between}
.learn summary::after{content:"+";color:var(--ink2);font-size:20px;line-height:1}
.learn details[open] summary::after{content:"–"}
.learn details p,.learn details li{font-size:14.5px;line-height:1.55}
.learn details ol,.learn details ul{padding-left:20px}
.learn svg{width:100%;height:auto;margin:6px 0 12px;border-radius:10px}

/* quiz */
.quiz .big{font:700 22px/1.25 var(--serif);margin:6px 0 10px}
.score{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:8px}
.feedback{margin:14px 0;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.45}
.feedback.good{background:#dcf5ea;color:#0b4f35}.feedback.mid{background:#fff1d1;color:#7a4b00}.feedback.bad{background:#fde8d8;color:#8a2f08}
.progress{height:6px;background:#e9e4d6;border-radius:6px;overflow:hidden;margin:6px 0 14px}
.progress div{height:100%;background:var(--water);transition:.3s}

/* markers */
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 8px #0006;color:#fff;transition:transform .15s}
.mk svg{width:16px;height:16px}
.mk.water{background:var(--water)}.mk.power{background:var(--power)}
.mk:hover,.mk.sel{transform:scale(1.25)}
.mk.sel{box-shadow:0 0 0 6px #ffffffcc,0 0 0 9px var(--ink),0 2px 8px #0006}
.lbl.leaflet-tooltip{background:#fff;border:0;border-radius:6px;box-shadow:0 1px 5px #0004;font:600 12px var(--sans);color:var(--ink);padding:3px 7px}
.lbl.leaflet-tooltip:before{display:none}
.nolabels .lbl{display:none}
.leaflet-popup-content-wrapper{border-radius:12px}
.pop b{font:700 15px var(--serif)}
.leaflet-container{font-family:var(--sans)}

/* map overlay legend */
.legend{position:absolute;right:12px;bottom:26px;z-index:500;background:#ffffffee;backdrop-filter:blur(6px);border-radius:12px;padding:10px 14px;font-size:12.5px;box-shadow:0 2px 10px #0003;line-height:1.9}
.legend span{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}

/* presentation mode */
#caption{display:none}
.present #app{grid-template-columns:1fr;grid-template-rows:1fr}
.present #side{display:none}
.present .mk{width:42px;height:42px}.present .mk svg{width:23px;height:23px}
.present .lbl.leaflet-tooltip{font-size:16px;padding:5px 10px}
.present .nolabels .lbl{display:block}
.present #caption{display:flex;position:absolute;left:0;right:0;bottom:0;z-index:1000;padding:18px 28px;
  background:linear-gradient(0deg,#0d2b3aee 55%,#0d2b3a00);color:#fff;gap:24px;align-items:flex-end}
#caption .t{flex:1}
#caption h2{font:700 34px/1.1 var(--serif);margin:0 0 4px}
#caption p{margin:0;font-size:19px;opacity:.9}
#caption .ctl{display:flex;gap:8px}
#caption .ctl button{background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:12px;padding:12px 18px;font-size:18px;font-weight:700}
.pbar{display:none}
.present .pbar{display:flex;position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:1000;background:#fff;border-radius:99px;padding:5px;box-shadow:0 4px 18px #0004;gap:4px}
.pbar{flex-wrap:wrap;justify-content:center;max-width:96vw}
.pbar button{border:0;background:none;border-radius:99px;padding:10px 22px;font-size:18px;font-weight:700;color:var(--ink2)}
.pbar button.on[data-cat=all]{background:var(--ink);color:#fff}
.pbar button.on[data-cat=water]{background:var(--water);color:#fff}
.pbar button.on[data-cat=power]{background:var(--power);color:#fff}
.pbar .x{color:var(--warn)}
.present .legend{font-size:16px;bottom:100px}

/* mobile */
#openSheet{display:none}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:46vh 1fr}
  main{order:-1}
  #side{border-right:0;border-top:1px solid var(--line)}
  .head{padding:12px 16px}.head h1{font-size:19px}.head .row{margin-top:8px}
  .legend{bottom:10px;right:8px;font-size:11px;padding:6px 10px;line-height:1.6}
  .present #app{grid-template-rows:1fr 0}
  #caption h2{font-size:22px}#caption p{font-size:14px}
  .pbar button{padding:8px 12px;font-size:14px}
}
@media print{#side,.legend{display:none}#app{display:block}}
</style>
</head>
<body class="nolabels">
<div id="app">
  <aside id="side">
    <div class="head">
      <div class="top"><h1 data-i18n="title"></h1>
        <div class="lang" id="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="zh">中文</button></div></div>
      <p data-i18n="sub"></p>
      <div class="row">
        <button class="pill-btn" id="btnPresent" title="Shortcut: P" data-i18n="present"></button>
        <button class="pill-btn" id="btnReset" data-i18n="reset"></button>
      </div>
    </div>
    <div class="seg" id="seg"></div>
    <div class="tabs" id="tabs"></div>
    <section class="pane on" id="p-explore">
      <div id="listView">
        <div class="chips" id="chips"></div>
        <div class="filters">
          <input id="q" type="search">
          <select id="state"></select>
        </div>
        <div id="list"></div>
      </div>
      <div id="detail" class="detail" hidden></div>
    </section>
    <section class="pane learn" id="p-learn"></section>
    <section class="pane quiz" id="p-quiz"></section>
  </aside>
  <main>
    <div id="map"></div>
    <div class="legend" id="legend"></div>
    <div class="pbar" id="pbar"></div>
    <div id="caption">
      <div class="t"><h2 id="capT"></h2><p id="capS"></p></div>
      <div class="ctl"><button id="pPrev">←</button><button id="pNext">→</button></div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="facilities.js"></script>

let askRound=0;
function pickAsk(f){
  const pool=ASK[lang][f.kind].map((q,i)=>i);let seed=(f.id+1)*7919+askRound*104729;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  return pool.slice(0,3).map(i=>ASK[lang][f.kind][i]);
}
const kindOf=p=>p.category==='water'?(/lake|wetland/i.test(p.type)?'lake':'dam'):(p.fuel==='Hydro'?'hydro':'thermal');
const feats=window.FACILITIES.features.map((f,i)=>({id:i,lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],...f.properties,kind:kindOf(f.properties)}));
feats.sort((a,b)=>a.name.localeCompare(b.name));feats.forEach((f,i)=>f.id=i);
const nm=f=>lang==='zh'?(ZH_NAME[f.name]||(ZH_GUESS[f.name]?ZH_GUESS[f.name]+'（'+f.name+'）':f.name)):f.name;
const zhVerified=f=>!!ZH_NAME[f.name];
const stN=s=>lang==='zh'?(ZH_STATE[s]||s):s;
const tyN=s=>lang==='zh'?(ZH_TYPE[s]||s):s;
const fuN=s=>lang==='zh'?(ZH_FUEL[s]||s):s;
const state={order:'state',cat:'all',kinds:new Set(Object.keys(KINDS)),q:'',st:'',sel:null,present:false,quiz:null};
const visible=()=>feats.filter(f=>(state.cat==='all'||f.category===state.cat)&&state.kinds.has(f.kind)&&
  (!state.st||f.state===state.st)&&(!state.q||(f.name+' '+nm(f)+' '+f.state+' '+stN(f.state)).toLowerCase().includes(state.q)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- photos (Wikipedia, loaded in the browser) ---------- */
const photoCache={};
function getPhoto(f){
  const title=WIKI[f.name]||f.name;
  if(photoCache[title]) return photoCache[title];
  const api='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=640';
  const pick=j=>{const pg=Object.values((j.query&&j.query.pages)||{}).filter(p=>p.thumbnail).sort((a,b)=>(a.index||0)-(b.index||0))[0];
    return pg?{src:pg.thumbnail.source,url:'https://en.wikipedia.org/wiki/'+encodeURIComponent(pg.title.replace(/ /g,'_')),title:pg.title}:null};
  return photoCache[title]=fetch(api+'&redirects=1&titles='+encodeURIComponent(title)).then(r=>r.json()).then(pick)
    .then(r=>r||fetch(api+'&generator=search&gsrlimit=1&gsrsearch='+encodeURIComponent(title+' Malaysia')).then(r=>r.json()).then(pick))
    .catch(()=>null);
}

/* ---------- map ---------- */
const map=L.map('map',{zoomControl:false,zoomSnap:.25}).fitBounds([[0.9,99.6],[7.4,119.3]],{padding:[10,10]});
L.control.zoom({position:'topright'}).addTo(map);
const esri=(n,x='')=>L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/${n}/MapServer/tile/{z}/{y}/{x}`,{maxZoom:17,attribution:'Tiles &copy; Esri'+x});
const base={'Relief':esri('World_Topo_Map').addTo(map),'Clean':esri('Canvas/World_Light_Gray_Base'),'Streets':esri('World_Street_Map'),'Satellite':esri('World_Imagery')};
L.control.layers(base,null,{position:'topright'}).addTo(map);
const home=map.getBounds();
const layer=L.layerGroup().addTo(map), markers={};
feats.forEach(f=>{
  const m=L.marker([f.lat,f.lon],{icon:L.divIcon({className:'',html:`<div class="mk ${f.category}">${ICON[f.category]}</div>`,iconSize:[30,30]}),title:f.name,keyboard:true});
  m.bindTooltip(esc(f.name),{permanent:true,direction:'right',offset:[14,0],className:'lbl'});
  m.on('click',()=>select(f.id,{fly:false}));
  markers[f.id]=m;
});
function syncLabels(){document.body.classList.toggle('nolabels',map.getZoom()<7.5&&!state.present)}
map.on('zoomend',syncLabels);

function refresh(){
  const v=visible(),ids=new Set(v.map(f=>f.id));
  layer.clearLayers();
  if(!state.quiz) v.forEach(f=>layer.addLayer(markers[f.id]));
  $('#cAll').textContent=t('places')(feats.length);
  $('#cWater').textContent=t('places')(feats.filter(f=>f.category==='water').length);
  $('#cPower').textContent=t('places')(feats.filter(f=>f.category==='power').length);
  $$('#seg button, #pbar button[data-cat]').forEach(b=>b.classList.toggle('on',b.dataset.cat===state.cat));
  $$('#chips .chip').forEach(c=>c.classList.toggle('on',state.kinds.has(c.dataset.k)));
  const L_=$('#list');
  L_.innerHTML=v.length?v.map(f=>`<button class="item" data-id="${f.id}"><span class="ico ${f.category}">${ICON[f.category]}</span>
    <span><div class="nm">${esc(nm(f))}</div><div class="sub">${esc(stN(f.state))} · ${f.fuel?esc(fuN(f.fuel)):esc(tyN(f.type))}</div></span></button>`).join('')
    :`<div class="empty">${t('empty')}</div>`;
  if(state.sel!==null&&!ids.has(state.sel)) closeDetail();
}

/* ---------- explore / detail ---------- */
function select(id,{fly=true}={}){
  const f=feats[id];state.sel=id;
  $$('.mk').forEach(e=>e.classList.remove('sel'));
  markers[id].getElement()?.firstChild.classList.add('sel');
  if(fly) map.flyTo([f.lat,f.lon],Math.max(map.getZoom(),9),{duration:.9});
  renderDetail();
  $('#listView').hidden=true;$('#detail').hidden=false;
  setTab('explore');
}
function renderDetail(){
  const f=feats[state.sel];if(!f)return;
  const T=TEACH[lang][f.kind],ok=f.confidence!=='C',id=f.id;
  $('#detail').innerHTML=`<button class="back" id="back">${t('back')}</button>
   <h2>${esc(nm(f))}</h2>${lang==='zh'?`<p class="sub-en">${esc(f.name)}${zhVerified(f)?'':' · 中文名待核实'}</p>`:''}
   <span class="tag ${f.category}">${esc(t('k1_'+f.kind))}</span>
   <span class="tag ${ok?'ok':'approx'}">${ok?t('ok'):t('approx')}</span>
   <figure class="photo" id="photo" style="margin-left:0;margin-right:0"></figure>
   <dl class="facts"><dt>${t('fState')}</dt><dd>${esc(stN(f.state))}</dd><dt>${t('fType')}</dt><dd>${esc(tyN(f.type))}</dd>
   ${f.fuel?`<dt>${t('fEnergy')}</dt><dd>${esc(fuN(f.fuel))}</dd>`:''}${f.note?`<dt>${t('fSize')}</dt><dd>${esc(t('sizeFix')(f.note))}</dd>`:''}
   <dt>${t('fCoord')}</dt><dd>${f.lat.toFixed(3)}°N, ${f.lon.toFixed(3)}°E</dd></dl>
   <div class="box"><h3>${t('what')}</h3><p>${T.what}</p></div>
   <div class="box q"><h3>${t('think')}</h3><ul id="asks">${pickAsk(f).map(a=>`<li>${a}</li>`).join('')}</ul><button class="btn ghost" id="moreq" style="margin-top:6px;padding:6px 12px;font-size:13px">${t('moreQ')}</button></div>
   ${ok?'':`<p style="font-size:12.5px;color:var(--ink2)">${t('approxNote')}</p>`}
   <div class="nav2"><button class="btn ghost" id="sat">${t('sat')}</button><button class="btn" id="nxt">${t('next')}</button></div>`;
  $('#back').onclick=closeDetail;
  $('#moreq').onclick=()=>{askRound++;$('#asks').innerHTML=pickAsk(f).map(a=>`<li>${a}</li>`).join('')};
  $('#sat').onclick=()=>{map.removeLayer(base.Relief);map.removeLayer(base.Clean);map.removeLayer(base.Streets);base.Satellite.addTo(map);map.flyTo([f.lat,f.lon],12,{duration:1})};
  $('#nxt').onclick=()=>step(1);
  getPhoto(f).then(p=>{const el=$('#photo');if(!p||!el||state.sel!==id)return;
    el.innerHTML=`<img alt="${esc(nm(f))}" src="${esc(p.src)}" loading="lazy"><figcaption>${t('photoBy')}: <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></figcaption>`;
    el.classList.add('on');el.querySelector('img').onerror=()=>el.classList.remove('on')});
  const tl=tourList(),pos=tl.findIndex(x=>x.id===f.id)+1;
  $('#capT').textContent=nm(f);$('#capS').textContent=`${pos?pos+' / '+tl.length+' · ':''}${stN(f.state)} · ${f.fuel?fuN(f.fuel)+t('power_sfx'):tyN(f.type)} — ${T.what.split(/(?<=[.。])\s*/)[0]}`;
}
function closeDetail(){state.sel=null;$('#detail').hidden=true;$('#listView').hidden=false;$$('.mk').forEach(e=>e.classList.remove('sel'));
  $('#capT').textContent=t('capT');$('#capS').textContent=t('capS')}
const stKey=s=>s.replace(/\s*\(.*\)/,'');
function tourList(){const v=visible();
  return state.order==='state'?[...v].sort((a,b)=>stKey(a.state).localeCompare(stKey(b.state))||a.name.localeCompare(b.name)):v}
function step(d){
  const v=tourList();if(!v.length)return;
  let i=v.findIndex(f=>f.id===state.sel);i=i<0?(d>0?0:v.length-1):(i+d+v.length)%v.length;
  select(v[i].id);
}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.item');if(b)select(+b.dataset.id)});

/* filters */
$('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.k;state.kinds.has(k)?state.kinds.delete(k):state.kinds.add(k);refresh()});
$('#state').onchange=e=>{state.st=e.target.value;refresh();fitVisible()};
$('#q').oninput=e=>{state.q=e.target.value.trim().toLowerCase();refresh()};
function setCat(c){state.cat=c;
  state.kinds=new Set(Object.entries(KINDS).filter(([k,v])=>c==='all'||v.cat===c).map(([k])=>k));
  refresh();fitVisible()}
function fitVisible(){const v=visible();if(!v.length)return;
  v.length===1?map.flyTo([v[0].lat,v[0].lon],9):map.flyToBounds(L.latLngBounds(v.map(f=>[f.lat,f.lon])).pad(.25),{duration:.8,maxZoom:10})}
$('#btnReset').onclick=()=>{state.q='';state.st='';$('#q').value='';$('#state').value='';closeDetail();setCat('all');
  if(!map.hasLayer(base.Relief)){map.removeLayer(base.Satellite);base.Relief.addTo(map)}map.flyToBounds(home,{duration:.8})};

/* ---------- tabs ---------- */
function setTab(t_){$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t_));
  $$('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t_));
  if(t_==='quiz'&&!state.quiz)renderQuizIntro(); if(t_!=='quiz'&&state.quiz)endQuiz()}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)};

/* ---------- learn ---------- */
const L_TXT={
 en:{lbl:['Reservoir','Dam','Penstock (pipe)','Turbine + generator','Power lines','River','Intake gate','Transformer','Tailrace'],
  svg:'Cross-section of a hydroelectric dam: reservoir, dam, penstock, turbine and generator, power lines and river',
  hydroQ:'How does a hydroelectric plant work?',
  steps:['The dam holds river water high up, forming a reservoir.','The intake gate opens (a screen keeps out logs and debris) and water rushes down the penstock.','At the powerhouse at the foot of the dam, the water hits the turbine and spins it.','The turbine shaft turns the generator above it, which makes electricity.','A transformer raises the voltage so power lines can carry it to the grid, while the used water leaves through the tailrace back to the river.'],
  html:`<details><summary>Dam vs reservoir vs catchment</summary><p><b>Catchment:</b> the land where rain flows to one river. <b>Dam:</b> the wall across the river. <b>Reservoir:</b> the lake that builds up behind the dam. Bigger catchment + steady rainfall = more reliable water.</p></details>
<details><summary>Why are hydro dams in the highlands?</summary><p>Power depends on <b>flow</b> (how much water) and <b>head</b> (how far it drops). Mountains give steep drops and heavy rain, so Perak, Pahang, Terengganu, Kelantan, Sabah and Sarawak host the biggest hydro schemes.</p></details>
<details><summary>Why are thermal plants on the coast?</summary><p>Coal and gas arrive by ship, sea water cools the steam, and ports and industrial areas need lots of power nearby. Look for Manjung, Tanjung Bin and Pasir Gudang on the map.</p></details>
<details><summary>One dam, many jobs</summary><ul><li><b>Drinking water</b> – Semenyih, Langat, Air Itam</li><li><b>Irrigation</b> – Pedu, Timah Tasoh (rice fields of the north)</li><li><b>Electricity</b> – Bakun, Kenyir, Temenggor</li><li><b>Flood control</b> – holding back monsoon rain</li></ul></details>
<details><summary>Costs and trade-offs</summary><ul><li>Flooding forests and villages when a reservoir fills</li><li>Changes to river life downstream</li><li>Coal and gas plants release carbon dioxide</li><li>Hydro depends on rainfall, so droughts reduce output</li></ul></details>
<details><summary>About the data</summary><p>Locations marked <b>approximate</b> are placed by general geographic knowledge and may be off by several kilometres. Source-checked locations come from JPS and hydropower references.</p></details>`},
 zh:{lbl:['水库','水坝','压力水管','涡轮机＋发电机','输电线','河流','进水口闸门','变压器','尾水渠'],
  svg:'水力发电站剖面图：水库、水坝、压力水管、涡轮机和发电机、输电线与河流',
  hydroQ:'水力发电站是怎么运作的？',
  steps:['水坝把河水拦在高处，形成水库。','进水口闸门打开（拦污栅挡住木头和杂物），水沿压力水管冲下去。','在坝脚的发电厂房，水冲击涡轮机使它旋转。','涡轮机的转轴带动上方的发电机发电。','变压器提高电压，输电线才能把电送到电网；用过的水则经尾水渠流回河里。'],
  html:`<details><summary>水坝、水库和集水区有什么不同？</summary><p><b>集水区：</b>雨水汇流到同一条河的土地范围。<b>水坝：</b>横跨河流的拦水墙。<b>水库：</b>水坝后面蓄积成的湖。集水区越大、降雨越稳定，水源就越可靠。</p></details>
<details><summary>为什么水力发电坝多在高地？</summary><p>发电量取决于<b>流量</b>（水有多少）和<b>水头</b>（水落下的高度）。山区落差大、雨量多，因此霹雳、彭亨、登嘉楼、吉兰丹、沙巴和砂拉越拥有最大的水力发电工程。</p></details>
<details><summary>为什么火力发电站建在海岸？</summary><p>煤和天然气用船运来，海水可以冷却蒸汽，港口和工业区附近也需要大量电力。请在地图上找找曼绒、丹绒滨和巴西古当。</p></details>
<details><summary>一座水坝，多种用途</summary><ul><li><b>饮用水</b> – 士毛月、冷岳、亚依淡</li><li><b>灌溉</b> – 比都、添马达索（北部的稻田）</li><li><b>发电</b> – 巴昆、肯逸、天猛公</li><li><b>防洪</b> – 拦住季风带来的大雨</li></ul></details>
<details><summary>代价与取舍</summary><ul><li>水库蓄水时会淹没森林和村庄</li><li>下游的河流生态会改变</li><li>燃煤和燃气电厂会排放二氧化碳</li><li>水力发电依赖降雨，干旱会使发电量下降</li></ul></details>
<details><summary>关于数据</summary><p>标注为<b>近似</b>的位置是凭一般地理知识放置的，可能有几公里的误差。已核对来源的位置来自 JPS 和水电资料。</p></details>`}};

function renderLearn(){
  const l=L_TXT[lang];
  $('#p-learn').innerHTML=`<details open><summary>${l.hydroQ}</summary>${hydroSVG(l)}<ol>${l.steps.map(s=>`<li>${s}</li>`).join('')}</ol></details>`+l.html}

/* ---------- quiz ---------- */
const ROUNDS=8;
let guessLayer=L.layerGroup().addTo(map);
function renderQuizIntro(){
  const c=state.cat;
  $('#p-quiz').innerHTML=`<div class="big">${t('qTitle')}</div><p style="line-height:1.5">${t('qIntro')(ROUNDS)}</p>
  <p style="font-size:13px;color:var(--ink2)">${t('qUses')(c)}</p><button class="btn" id="qs">${t('qStart')}</button>`;
  $('#qs').onclick=startQuiz}
function startQuiz(){
  const pool=feats.filter(f=>state.cat==='all'||f.category===state.cat).sort(()=>Math.random()-.5).slice(0,ROUNDS);
  state.quiz={pool,i:0,pts:0,answered:false};closeDetail();refresh();map.flyToBounds(home,{duration:.6});nextQ()}
function nextQ(){
  const q=state.quiz;guessLayer.clearLayers();
  if(q.i>=q.pool.length)return finishQuiz();
  q.answered=false;const f=q.pool[q.i];
  $('#p-quiz').innerHTML=`<div class="score"><span>${t('qNum')(q.i+1,q.pool.length)}</span><span>${t('pts')(q.pts)}</span></div>
   <div class="progress"><div style="width:${q.i/q.pool.length*100}%"></div></div>
   <div class="big">${t('qFind')}${esc(nm(f))}</div><p style="color:var(--ink2);font-size:14px">${esc(stN(f.state))} · ${esc(f.fuel?fuN(f.fuel)+t('power_sfx'):tyN(f.type))}<br>${t('qClick')}</p><div id="fb"></div>`}
map.on('click',e=>{
  const q=state.quiz;if(!q||q.answered)return;q.answered=true;
  const f=q.pool[q.i],km=map.distance(e.latlng,[f.lat,f.lon])/1000,pts=km<30?10:km<80?7:km<200?4:km<400?2:0;q.pts+=pts;
  L.marker(e.latlng,{icon:L.divIcon({className:'',html:'<div class="mk" style="background:#0d2b3a">?</div>',iconSize:[30,30]})}).addTo(guessLayer);
  L.marker([f.lat,f.lon],{icon:L.divIcon({className:'',html:`<div class="mk ${f.category}">${ICON[f.category]}</div>`,iconSize:[30,30]})}).addTo(guessLayer);
  L.polyline([e.latlng,[f.lat,f.lon]],{color:'#0d2b3a',dashArray:'6 6',weight:2}).addTo(guessLayer);
  map.flyToBounds(L.latLngBounds([e.latlng,[f.lat,f.lon]]).pad(.6),{duration:.8,maxZoom:9});
  const cls=pts>=7?'good':pts>=2?'mid':'bad',M=t('qMsg'),msg=pts>=10?M[0]:pts>=7?M[1]:pts>=2?M[2]:M[3];
  $('#fb').innerHTML=`<div class="feedback ${cls}"><b>${msg}</b><br>${t('qAway')(Math.round(km),pts)}<br><small>${esc(TEACH[lang][f.kind].what.split(/(?<=[.。])\s*/)[0])}</small></div>
   <button class="btn" id="nq">${q.i+1<q.pool.length?t('qNext'):t('qSee')}</button>`;
  $('#nq').onclick=()=>{q.i++;nextQ()};
});
function finishQuiz(){
  const q=state.quiz,max=q.pool.length*10,G=t('qGood');
  $('#p-quiz').innerHTML=`<div class="big">${t('qScore')(q.pts,max)}</div>
   <div class="feedback ${q.pts>max*.7?'good':q.pts>max*.4?'mid':'bad'}">${q.pts>max*.7?G[0]:q.pts>max*.4?G[1]:G[2]}</div>
   <button class="btn" id="qs">${t('qAgain')}</button> <button class="btn ghost" id="qe">${t('qBack')}</button>`;
  $('#qs').onclick=startQuiz;$('#qe').onclick=()=>setTab('explore')}
function endQuiz(){state.quiz=null;guessLayer.clearLayers();refresh();map.flyToBounds(home,{duration:.6})}

/* ---------- presentation ---------- */
function setPresent(on){
  state.present=on;document.body.classList.toggle('present',on);
  if(!on&&autoTimer){clearInterval(autoTimer);autoTimer=null;syncTour()}
  if(on&&state.quiz)setTab('explore');
  setTimeout(()=>{map.invalidateSize();syncLabels();if(on)fitVisible()},60)}
$('#btnPresent').onclick=()=>setPresent(true);
$('#pNext').onclick=()=>step(1);$('#pPrev').onclick=()=>step(-1);
addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='p'||e.key==='P')setPresent(!state.present);
  else if(state.present&&(e.key==='o'||e.key==='O'))$('#pOrder').click();
  else if(state.present&&e.key===' '){e.preventDefault();toggleAuto()}
  else if(e.key==='Escape'&&state.present)setPresent(false);
  else if(state.present&&e.key==='ArrowRight')step(1);
  else if(state.present&&e.key==='ArrowLeft')step(-1);
  else if(state.present&&e.key==='1')setCat('all');else if(state.present&&e.key==='2')setCat('water');else if(state.present&&e.key==='3')setCat('power');
});

/* ---------- tour order + autoplay ---------- */
let autoTimer=null;
function syncTour(){const o=$('#pOrder'),a=$('#pAuto');if(!o)return;
  o.textContent=state.order==='state'?t('ordS'):t('ordA');a.textContent=autoTimer?t('pause'):t('auto')}
function toggleAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null}else{step(1);autoTimer=setInterval(()=>step(1),9000)}syncTour()}
/* ---------- apply language ---------- */
function setLang(l){
  lang=l;try{localStorage.setItem('lang',l)}catch(e){}
  document.documentElement.lang=l==='zh'?'zh-Hans':'en';document.title=t('title');
  $$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  $$('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  $('#seg').innerHTML=`<button data-cat="all">${t('all')}<small id="cAll"></small></button><button data-cat="water">${t('water')}<small id="cWater"></small></button><button data-cat="power">${t('power')}<small id="cPower"></small></button>`;
  $$('#seg button').forEach(b=>b.onclick=()=>setCat(b.dataset.cat));
  $('#pbar').innerHTML=`<button data-cat="all">${t('all')}</button><button data-cat="water">${t('water')}</button><button data-cat="power">${t('power')}</button><button id="pOrder"></button><button id="pAuto"></button><button class="x" id="pExit">${t('exit')}</button>`;
  $('#pOrder').onclick=()=>{state.order=state.order==='state'?'az':'state';syncTour();if(state.sel!==null)renderDetail()};
  $('#pAuto').onclick=toggleAuto;syncTour();
  $$('#pbar button[data-cat]').forEach(b=>b.onclick=()=>setCat(b.dataset.cat));$('#pExit').onclick=()=>setPresent(false);
  const on=($('#tabs .on')||{dataset:{}}).dataset.tab||'explore';
  $('#tabs').innerHTML=['explore','learn','quiz'].map(k=>`<button data-tab="${k}">${t(k)}</button>`).join('');
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===on));
  $('#q').placeholder=t('search');$('#q').setAttribute('aria-label',t('search'));
  $('#legend').innerHTML=`<div><span style="background:var(--water)"></span>${t('lgWater')}</div><div><span style="background:var(--power)"></span>${t('lgPower')}</div>`;
  $('#chips').innerHTML=Object.entries(KINDS).map(([k,v])=>`<button class="chip" data-k="${k}" style="--c:${v.color}"><i></i>${t('k_'+k)}</button>`).join('');
  $('#state').innerHTML=`<option value="">${t('allStates')}</option>`+[...new Set(feats.map(f=>f.state))].sort().map(s=>`<option value="${esc(s)}">${esc(stN(s))}</option>`).join('');
  $('#state').value=state.st;
  feats.forEach(f=>markers[f.id].setTooltipContent(esc(nm(f))).options.title=f.name);
  renderLearn();
  refresh();
  if(state.sel!==null)renderDetail();else{$('#capT').textContent=t('capT');$('#capS').textContent=t('capS')}
  if(state.quiz){if(state.quiz.i<state.quiz.pool.length)nextQ()}else if($('#p-quiz').innerHTML)renderQuizIntro();
}
$('#lang').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.l!==lang)setLang(b.dataset.l)};
setLang(lang);syncLabels();
</script>
