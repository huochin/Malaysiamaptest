<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malaysia Water &amp; Power Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;font-family:system-ui,Segoe UI,sans-serif}
#panel{position:absolute;z-index:1000;top:12px;left:12px;background:white;padding:14px 16px;
border-radius:10px;box-shadow:0 2px 12px #0003;max-width:320px}
#panel h1{font-size:18px;margin:0 0 6px}
#panel p{font-size:12px;line-height:1.45;margin:5px 0}
#panel label{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0;cursor:pointer}
.badge{display:inline-block;padding:2px 7px;border-radius:99px;background:#eef2ff;margin:2px;font-size:12px}
.dot{width:14px;height:14px;border:2px solid #fff;box-shadow:0 0 3px #000a;display:inline-block}
.water{background:#1e78d4;border-radius:50%}
.power{background:#f59e0b;border-radius:3px}
.mk{width:16px;height:16px;border:2px solid #fff;box-shadow:0 0 4px #000a;box-sizing:border-box}
.mk.water{border-radius:50%}.mk.power{border-radius:3px}
</style>
</head>
<body>
<div id="panel">
<h1>🇲🇾 Malaysia Water &amp; Power Explorer</h1>
<label><input type="checkbox" id="tWater" checked><span class="dot water"></span> Water: dams, reservoirs, lakes <span class="badge" id="nWater"></span></label>
<label><input type="checkbox" id="tPower" checked><span class="dot power"></span> Power plants (hydro &amp; thermal) <span class="badge" id="nPower"></span></label>
<p><b>Confidence:</b> A/B = traced to a source. <b>C = approximate</b>, from general
geographic knowledge — verify before relying on exact positions.</p>
<p>Click a marker for details. Some dams that also host a hydro plant appear as two overlapping markers.</p>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([4.2,108.0],6);
const street=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
 {maxZoom:19,attribution:'Tiles &copy; Esri'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
 {maxZoom:19,attribution:'Tiles &copy; Esri'});
L.control.layers({'Street Map':street,'Satellite':sat}).addTo(map);

const groups={water:L.layerGroup().addTo(map),power:L.layerGroup().addTo(map)};
const counts={water:0,power:0};
const bounds=[];
fetch('facilities.geojson').then(r=>r.json()).then(data=>{
 data.features.forEach(f=>{
  const p=f.properties,[lon,lat]=f.geometry.coordinates;
  const icon=L.divIcon({className:'',html:`<div class="mk ${p.category}"></div>`,iconSize:[16,16]});
  const m=L.marker([lat,lon],{icon,title:p.name}).bindPopup(
   `<b>${p.name}</b><br>${p.state}<br>Type: ${p.type}`+
   (p.fuel?`<br>Fuel: ${p.fuel}`:'')+(p.note?`<br>${p.note}`:'')+
   `<br>Coordinates: ${lat.toFixed(4)}, ${lon.toFixed(4)}<br>Confidence: ${p.confidence}<br><small>${p.coordinate_source}</small>`);
  groups[p.category].addLayer(m);counts[p.category]++;bounds.push([lat,lon]);
 });
 nWater.textContent=counts.water;nPower.textContent=counts.power;
 map.fitBounds(bounds,{padding:[40,40]});
});
[['tWater','water'],['tPower','power']].forEach(([id,k])=>
 document.getElementById(id).addEventListener('change',e=>
  e.target.checked?map.addLayer(groups[k]):map.removeLayer(groups[k])));
</script>
</body>
</html>
